[pytest]
; Settings for the quest site's OWN test suite.
;
; Having this file here matters: pytest picks the nearest pytest.ini
; walking up from the test path, so `python -m pytest site/tests/` uses
; this one and treats site/ as the rootdir. That keeps the site suite
; completely separate from the learner's practice runs - no Allure
; results, no retries hiding real flakiness, and it never overwrites
; reports/report.html at the repo root.

testpaths = tests

; --browser chromium  -> the site is plain HTML/JS/WASM; one engine proves it
; -q                  -> the interesting output is the failures, not the list
addopts = --browser chromium -q

; Registered so a typo in a marker name is an error, not a silent skip.
markers =
    slow: needs the Python runtime to boot in the browser (a few seconds)
