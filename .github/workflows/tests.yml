# Runs the test suite in GitHub Actions and attaches the reports to the
# run as a downloadable artifact (Actions tab -> the run -> "test-reports").
#
# report.html is self-contained and opens anywhere. The Allure folder
# needs "allure open" locally; its trend history is carried between runs
# through the cache below, so the graphs still build up a point per run.
#
# This workflow does NOT publish anything. GitHub Pages serves the
# learning site instead - see pages.yml - because a suite driving a
# third-party practice site is too slow and too occasionally-down to sit
# in front of a learner opening a lesson.

name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: read            # nothing is published from here

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install the browser
        run: playwright install --with-deps chromium

      # The runnable suite (tour-tests/) is created from the sources in
      # learn/ - the same step the tour does for learners.
      - name: Create the practice test suite
        run: python tour.py --create-tests

      # continue-on-error: a failed test run is exactly when we want the
      # report, so don't stop here. The last step restores the real
      # pass/fail status once the reports are safely attached.
      - name: Run tests
        id: tests
        run: pytest
        continue-on-error: true

      # Allure builds its trend graphs from a history/ folder carried
      # forward between runs. It used to ride along on the gh-pages
      # branch; with nothing published from here, the cache does the
      # same job. restore-keys means run N picks up run N-1's history.
      - name: Restore the report history
        uses: actions/cache@v4
        with:
          path: reports/allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Carry history into the new results
        run: |
          if [ -d reports/allure-history ]; then
            cp -r reports/allure-history reports/allure-results/history
          fi

      - name: Generate the Allure report
        run: |
          npm install -g allure-commandline
          allure generate reports/allure-results -o reports/allure-report --clean \
            --report-name "AutomationExercise Test Report"

      # Keep this run's history for the next one to build on.
      - name: Save the report history
        if: always()
        run: |
          rm -rf reports/allure-history
          cp -r reports/allure-report/history reports/allure-history 2>/dev/null || true

      - name: Attach reports to this run as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/report.html
            reports/allure-report

      # Reports are attached - now let the workflow show the true result.
      - name: Fail the workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
